<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Faso Live Sport</title>
<style>
  :root {
    --bg: #f4f5f7; --surface: #ffffff; --surface-2: #eef0f3; --text: #14171c;
    --muted: #6b7280; --border: #e3e6ea; --accent: #009e49; --accent-2: #ef2b2d;
    --live: #ef2b2d; --gold: #fcd116; --win: #009e49;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0e1116; --surface: #171b22; --surface-2: #1f2530; --text: #eef1f5;
      --muted: #8b93a1; --border: #262d38;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0e1116; --surface: #171b22; --surface-2: #1f2530; --text: #eef1f5;
    --muted: #8b93a1; --border: #262d38;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .app { max-width: 480px; margin: 0 auto; min-height: 100vh; padding-bottom: 76px; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }

  /* Header */
  header { position: sticky; top: 0; z-index: 5; background: var(--surface); border-bottom: 1px solid var(--border); }
  .top { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; }
  .brand { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 18px; }
  .flag { width: 22px; height: 15px; border-radius: 2px; background: linear-gradient(var(--accent-2) 50%, var(--accent) 50%); position: relative; }
  .flag::after { content: "★"; position: absolute; inset: 0; display: grid; place-items: center; font-size: 9px; color: var(--gold); }
  .icon-btn { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); }

  .sports { display: flex; gap: 8px; padding: 0 16px 10px; overflow-x: auto; scrollbar-width: none; }
  .chip { flex: none; padding: 7px 14px; border-radius: 999px; background: var(--surface-2); font-weight: 600; font-size: 14px; white-space: nowrap; }
  .chip.active { background: var(--accent); color: #fff; }

  .dates { display: flex; border-top: 1px solid var(--border); overflow-x: auto; scrollbar-width: none; }
  .date { flex: 1 0 64px; padding: 8px 4px; text-align: center; font-size: 12px; color: var(--muted); border-bottom: 2px solid transparent; }
  .date b { display: block; font-size: 14px; color: var(--text); }
  .date.active { border-bottom-color: var(--accent); color: var(--accent); }
  .date.active b { color: var(--accent); }

  .filters { display: flex; gap: 6px; padding: 12px 16px 4px; }
  .filters .chip { padding: 5px 12px; font-size: 13px; }
  .filters .chip.active { background: var(--text); color: var(--bg); }
  .live-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--live); margin-right: 5px; animation: pulse 1.4s infinite; }
  @keyframes pulse { 50% { opacity: .3; } }

  /* Match list */
  main { padding: 8px 16px; }
  .comp { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; margin-bottom: 12px; overflow: hidden; }
  .comp-head { display: flex; align-items: center; gap: 8px; padding: 10px 12px; font-weight: 700; font-size: 13px; border-bottom: 1px solid var(--border); }
  .comp-head small { color: var(--muted); font-weight: 500; }
  .match { display: grid; grid-template-columns: 48px 1fr auto 28px; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--border); width: 100%; text-align: left; }
  .match:last-child { border-bottom: 0; }
  .match:hover { background: var(--surface-2); }
  .status { font-size: 12px; color: var(--muted); text-align: center; font-variant-numeric: tabular-nums; }
  .status.live { color: var(--live); font-weight: 700; }
  .teams div, .scores div { display: flex; align-items: center; gap: 8px; height: 22px; }
  .teams .lose, .scores .lose { color: var(--muted); }
  .scores { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }
  .crest { width: 18px; height: 18px; border-radius: 50%; flex: none; display: grid; place-items: center; font-size: 9px; font-weight: 800; color: #fff; }
  .star { color: var(--muted); font-size: 18px; }
  .star.on { color: var(--gold); }
  .empty { text-align: center; color: var(--muted); padding: 40px 0; }

  /* Standings */
  table { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
  th, td { padding: 8px 6px; text-align: center; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 600; font-size: 12px; }
  td.team { text-align: left; display: flex; gap: 8px; align-items: center; }
  tr.q td:first-child { box-shadow: inset 3px 0 var(--accent); }
  tr.r td:first-child { box-shadow: inset 3px 0 var(--live); }

  /* Bottom nav */
  nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--surface); border-top: 1px solid var(--border); z-index: 6; }
  nav .inner { max-width: 480px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); }
  nav button { padding: 8px 0 10px; font-size: 11px; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 2px; }
  nav button span { font-size: 20px; line-height: 1; }
  nav button.active { color: var(--accent); font-weight: 700; }

  /* Match detail sheet */
  .sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 10; display: none; }
  .sheet-bg.open { display: block; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; max-width: 480px; margin: 0 auto; max-height: 88vh; overflow-y: auto; background: var(--bg); border-radius: 18px 18px 0 0; z-index: 11; transform: translateY(100%); transition: transform .25s; }
  .sheet.open { transform: none; }
  .hero { background: var(--surface); padding: 16px; text-align: center; border-bottom: 1px solid var(--border); }
  .hero .close { float: right; }
  .hero .comp-name { font-size: 12px; color: var(--muted); }
  .hero-row { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; margin-top: 14px; }
  .hero-team { display: flex; flex-direction: column; align-items: center; gap: 6px; font-weight: 600; font-size: 13px; }
  .hero-team .crest { width: 44px; height: 44px; font-size: 14px; }
  .hero-score { font-size: 34px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .tabs { display: flex; background: var(--surface); border-bottom: 1px solid var(--border); }
  .tabs button { flex: 1; padding: 10px; font-size: 13px; font-weight: 600; color: var(--muted); border-bottom: 2px solid transparent; }
  .tabs button.active { color: var(--accent); border-bottom-color: var(--accent); }
  .panel { padding: 16px; }
  .event { display: grid; grid-template-columns: 1fr 44px 1fr; gap: 6px; padding: 7px 0; font-size: 13px; align-items: center; }
  .event .min { text-align: center; color: var(--muted); font-weight: 700; }
  .event .r { text-align: left; } .event .l { text-align: right; }
  .stat { margin-bottom: 14px; }
  .stat-top { display: flex; justify-content: space-between; font-size: 13px; font-weight: 700; margin-bottom: 5px; }
  .stat-top span:nth-child(2) { font-weight: 500; color: var(--muted); }
  .bar { display: flex; gap: 4px; height: 6px; }
  .bar i { border-radius: 3px; background: var(--surface-2); flex: 1; position: relative; overflow: hidden; }
  .bar i b { position: absolute; top: 0; bottom: 0; border-radius: 3px; }
  .bar i:first-child b { right: 0; background: var(--accent); }
  .bar i:last-child b { left: 0; background: var(--muted); }
  .info { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px; font-size: 13px; display: grid; gap: 8px; }
  .info div { display: flex; justify-content: space-between; }
  .info span:first-child { color: var(--muted); }
  .remind { width: 100%; margin-top: 14px; padding: 12px; border-radius: 10px; background: var(--accent); color: #fff; font-weight: 700; }
  .demo { font-size: 11px; color: var(--muted); text-align: center; padding: 8px 16px 16px; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="top">
      <div class="brand"><div class="flag"></div>Faso Live Sport</div>
      <button class="icon-btn" id="themeBtn" title="Thème clair / sombre">◐</button>
    </div>
    <div class="sports" id="sports"></div>
    <div class="dates" id="dates"></div>
  </header>

  <div class="filters" id="filters"></div>
  <main id="main"></main>
  <p class="demo">Prototype — données fictives à but de démonstration.</p>
</div>

<nav><div class="inner" id="nav"></div></nav>

<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet"></div>

<script>
/* ---------- Demo data (fictional scores, real club names) ---------- */
const TEAMS = {
  RAH: { name: "Rahimo FC", color: "#d4302b" },
  USFA: { name: "USFA", color: "#2f5d34" },
  ASFAY: { name: "ASFA Yennenga", color: "#1f4fa3" },
  SAL: { name: "Salitas FC", color: "#e07b00" },
  DOU: { name: "AS Douanes", color: "#0f766e" },
  MAJ: { name: "Majestic FC", color: "#6d28d9" },
  VIT: { name: "Vitesse FC", color: "#b91c1c" },
  REAL: { name: "Real du Faso", color: "#1e3a8a" },
  SPC: { name: "Sporting des Cascades", color: "#15803d" },
  KOZ: { name: "KOZAF", color: "#a16207" },
  BF: { name: "Burkina Faso", color: "#009e49" },
  CIV: { name: "Côte d'Ivoire", color: "#f77f00" },
  // Basketball
  bDOU: { name: "AS Douanes BB", color: "#0f766e" },
  bUSFA: { name: "USFA Basket", color: "#2f5d34" },
  bASFAY: { name: "ASFA-Y Basket", color: "#1f4fa3" },
  bBBC: { name: "Bobo BC", color: "#be123c" },
  bSAL: { name: "Salitas Basket", color: "#e07b00" },
  bOBC: { name: "Ouaga BC", color: "#334155" },
  // Handball
  hASFAY: { name: "ASFA-Y Hand", color: "#1f4fa3" },
  hUSO: { name: "US Ouaga", color: "#7c2d12" },
};

const SPORTS = [
  { id: "foot", label: "⚽ Football" },
  { id: "basket", label: "🏀 Basketball" },
  { id: "hand", label: "🤾 Handball" },
];

// day: 0 = today, -1 = yesterday, 1 = tomorrow...
// status: "live" | "upcoming" | "finished"
const MATCHES = [
  { id: 1, sport: "foot", comp: "Ligue 1 Burkina", round: "J5", day: 0, status: "live", min: 63, h: "RAH", a: "USFA", hs: 2, as: 1,
    venue: "Stade Wobi, Bobo-Dioulasso", events: [[12,"h","⚽ But — Ouédraogo"],[34,"a","⚽ But — Sawadogo"],[51,"h","⚽ But — Traoré (pen.)"],[58,"a","🟨 Carton — Kaboré"]],
    stats: [["Possession", 54, 46, "%"],["Tirs", 11, 7],["Tirs cadrés", 5, 3],["Corners", 6, 2],["Fautes", 9, 13]] },
  { id: 2, sport: "foot", comp: "Ligue 1 Burkina", round: "J5", day: 0, status: "live", min: 27, h: "ASFAY", a: "SAL", hs: 0, as: 0,
    venue: "Stade du 4-Août, Ouagadougou", events: [[19,"a","🟨 Carton — Zongo"]], stats: [["Possession", 48, 52, "%"],["Tirs", 3, 4],["Tirs cadrés", 1, 1],["Corners", 2, 1],["Fautes", 5, 6]] },
  { id: 3, sport: "foot", comp: "Ligue 1 Burkina", round: "J5", day: 0, status: "upcoming", time: "18:00", h: "DOU", a: "MAJ", venue: "Stade Municipal, Ouagadougou" },
  { id: 4, sport: "foot", comp: "Ligue 1 Burkina", round: "J5", day: 0, status: "finished", h: "VIT", a: "REAL", hs: 1, as: 3, venue: "Stade Municipal, Ouagadougou",
    events: [[8,"a","⚽ But — Compaoré"],[40,"h","⚽ But — Ilboudo"],[66,"a","⚽ But — Diallo"],[88,"a","⚽ But — Compaoré"]], stats: [["Possession", 45, 55, "%"],["Tirs", 8, 14],["Tirs cadrés", 2, 7]] },
  { id: 5, sport: "foot", comp: "Ligue 1 Burkina", round: "J5", day: 1, status: "upcoming", time: "16:00", h: "SPC", a: "KOZ", venue: "Stade de Banfora" },
  { id: 6, sport: "foot", comp: "Étalons — Match amical", round: "", day: 2, status: "upcoming", time: "19:00", h: "BF", a: "CIV", venue: "Stade du 4-Août, Ouagadougou" },
  { id: 7, sport: "foot", comp: "Ligue 1 Burkina", round: "J4", day: -1, status: "finished", h: "USFA", a: "DOU", hs: 2, as: 2, venue: "Stade Municipal, Ouagadougou" },

  { id: 11, sport: "basket", comp: "Championnat national", round: "", day: 0, status: "live", min: "Q3 04:12", h: "bDOU", a: "bUSFA", hs: 58, as: 54, venue: "Palais des Sports de Ouaga 2000",
    events: [["Q1","h","24 – 19"],["Q2","a","15 – 21"],["Q3","h","19 – 14 (en cours)"]], stats: [["Rebonds", 28, 25],["Passes déc.", 12, 9],["3 points", 6, 8],["Lancers francs %", 71, 64, "%"]] },
  { id: 12, sport: "basket", comp: "Championnat national", round: "", day: 0, status: "upcoming", time: "20:00", h: "bASFAY", a: "bBBC", venue: "Gymnase de Bobo-Dioulasso" },
  { id: 13, sport: "basket", comp: "Championnat national", round: "", day: -1, status: "finished", h: "bSAL", a: "bOBC", hs: 71, as: 77, venue: "Palais des Sports de Ouaga 2000" },
  { id: 14, sport: "basket", comp: "Championnat national", round: "", day: 1, status: "upcoming", time: "19:30", h: "bUSFA", a: "bASFAY", venue: "Palais des Sports de Ouaga 2000" },

  { id: 21, sport: "hand", comp: "Championnat national", round: "", day: 0, status: "upcoming", time: "17:00", h: "hASFAY", a: "hUSO", venue: "Palais des Sports de Ouaga 2000" },
];

const STANDINGS = {
  foot: { title: "Ligue 1 Burkina", rows: [
    ["RAH",5,4,1,0,11,3],["REAL",5,3,1,1,9,5],["USFA",5,3,0,2,8,6],["DOU",4,2,2,0,6,3],["ASFAY",5,2,2,1,5,4],
    ["SAL",5,2,1,2,6,6],["MAJ",4,1,2,1,4,4],["SPC",4,1,1,2,3,5],["KOZ",4,0,2,2,2,6],["VIT",5,0,0,5,3,15] ] },
  basket: { title: "Championnat national", rows: [
    ["bDOU",8,7,1],["bUSFA",8,6,2],["bASFAY",8,4,4],["bOBC",8,3,5],["bSAL",8,2,6],["bBBC",8,2,6] ] },
};

/* ---------- State ---------- */
let state = { sport: "foot", day: 0, filter: "all", tab: "matches" };
let favs = new Set();
try { favs = new Set(JSON.parse(localStorage.getItem("fls-favs") || "[]")); } catch (e) {}
const saveFavs = () => { try { localStorage.setItem("fls-favs", JSON.stringify([...favs])); } catch (e) {} };

/* ---------- Helpers ---------- */
const $ = (id) => document.getElementById(id);
const initials = (n) => n.replace(/(FC|BB|Basket|Hand)/g, "").trim().split(/[\s-]+/).map(w => w[0]).join("").slice(0, 3).toUpperCase();
const crest = (code) => `<i class="crest" style="background:${TEAMS[code].color}">${initials(TEAMS[code].name)}</i>`;
const DAYS = ["Dim","Lun","Mar","Mer","Jeu","Ven","Sam"];
function dayLabel(offset) {
  if (offset === 0) return ["Aujourd'hui", ""];
  if (offset === -1) return ["Hier", ""];
  if (offset === 1) return ["Demain", ""];
  const d = new Date(); d.setDate(d.getDate() + offset);
  return [DAYS[d.getDay()], d.getDate() + "/" + (d.getMonth() + 1)];
}
function statusHtml(m) {
  if (m.status === "live") return `<div class="status live">${typeof m.min === "number" ? m.min + "'" : m.min}</div>`;
  if (m.status === "finished") return `<div class="status">Terminé</div>`;
  return `<div class="status">${m.time}</div>`;
}

/* ---------- Render ---------- */
function renderSports() {
  $("sports").innerHTML = SPORTS.map(s =>
    `<button class="chip ${s.id === state.sport ? "active" : ""}" data-sport="${s.id}">${s.label}</button>`).join("");
}
function renderDates() {
  let html = "";
  for (let i = -2; i <= 3; i++) {
    const [a, b] = dayLabel(i);
    html += `<button class="date ${i === state.day ? "active" : ""}" data-day="${i}"><b>${a}</b>${b}</button>`;
  }
  $("dates").innerHTML = html;
}
function renderFilters() {
  const liveCount = MATCHES.filter(m => m.status === "live" && m.sport === state.sport).length;
  const f = [["all","Tous"],["live",`<span class="live-dot"></span>En direct (${liveCount})`],["upcoming","À venir"],["finished","Terminés"]];
  $("filters").innerHTML = f.map(([id, l]) =>
    `<button class="chip ${state.filter === id ? "active" : ""}" data-filter="${id}">${l}</button>`).join("");
  $("filters").style.display = state.tab === "matches" ? "flex" : "none";
}
function matchRow(m) {
  const done = m.status === "finished";
  const hWin = done && m.hs > m.as, aWin = done && m.as > m.hs;
  const hasScore = m.status !== "upcoming";
  return `<button class="match" data-match="${m.id}">
    ${statusHtml(m)}
    <div class="teams">
      <div class="${aWin ? "lose" : ""}">${crest(m.h)}${TEAMS[m.h].name}</div>
      <div class="${hWin ? "lose" : ""}">${crest(m.a)}${TEAMS[m.a].name}</div>
    </div>
    <div class="scores">
      <div class="${aWin ? "lose" : ""}">${hasScore ? m.hs : ""}</div>
      <div class="${hWin ? "lose" : ""}">${hasScore ? m.as : ""}</div>
    </div>
    <span class="star ${favs.has(m.id) ? "on" : ""}" data-fav="${m.id}">${favs.has(m.id) ? "★" : "☆"}</span>
  </button>`;
}
function groupByComp(list) {
  const groups = {};
  list.forEach(m => (groups[m.comp] ||= []).push(m));
  return Object.entries(groups).map(([comp, ms]) =>
    `<section class="comp"><div class="comp-head">🇧🇫 ${comp} <small>${ms[0].round || ""}</small></div>${ms.map(matchRow).join("")}</section>`).join("");
}
function renderMain() {
  const main = $("main");
  document.querySelector(".dates").style.display = state.tab === "matches" ? "flex" : "none";
  if (state.tab === "matches") {
    let list = MATCHES.filter(m => m.sport === state.sport && m.day === state.day);
    if (state.filter !== "all") list = list.filter(m => m.status === state.filter);
    // Live first, then upcoming, then finished
    const order = { live: 0, upcoming: 1, finished: 2 };
    list.sort((a, b) => order[a.status] - order[b.status]);
    main.innerHTML = list.length ? groupByComp(list) : `<p class="empty">Aucun match pour ce jour.</p>`;
  } else if (state.tab === "live") {
    const list = MATCHES.filter(m => m.status === "live");
    main.innerHTML = list.length ? groupByComp(list) : `<p class="empty">Aucun match en direct.</p>`;
  } else if (state.tab === "favs") {
    const list = MATCHES.filter(m => favs.has(m.id));
    main.innerHTML = list.length ? groupByComp(list) : `<p class="empty">Touchez ☆ sur un match pour le suivre.</p>`;
  } else if (state.tab === "table") {
    const st = STANDINGS[state.sport];
    if (!st) { main.innerHTML = `<p class="empty">Classement bientôt disponible.</p>`; return; }
    const isFoot = state.sport === "foot";
    const head = isFoot ? "<th>#</th><th style='text-align:left'>Équipe</th><th>J</th><th>G</th><th>N</th><th>P</th><th>Diff</th><th>Pts</th>"
                        : "<th>#</th><th style='text-align:left'>Équipe</th><th>J</th><th>V</th><th>D</th><th>%</th>";
    const rows = st.rows.map((r, i) => {
      const cls = i < 2 ? "q" : i >= st.rows.length - 2 ? "r" : "";
      if (isFoot) {
        const [t, p, w, d, l, gf, ga] = r;
        return `<tr class="${cls}"><td>${i + 1}</td><td class="team">${crest(t)}${TEAMS[t].name}</td><td>${p}</td><td>${w}</td><td>${d}</td><td>${l}</td><td>${gf - ga > 0 ? "+" : ""}${gf - ga}</td><td><b>${w * 3 + d}</b></td></tr>`;
      }
      const [t, p, w, l] = r;
      return `<tr class="${cls}"><td>${i + 1}</td><td class="team">${crest(t)}${TEAMS[t].name}</td><td>${p}</td><td>${w}</td><td>${l}</td><td>${Math.round(w / p * 100)}</td></tr>`;
    }).join("");
    main.innerHTML = `<section class="comp"><div class="comp-head">🇧🇫 ${st.title}</div><table><tr>${head}</tr>${rows}</table></section>`;
  }
}
function renderNav() {
  const items = [["matches","📅","Matchs"],["live","🔴","Direct"],["favs","★","Favoris"],["table","📊","Classement"]];
  $("nav").innerHTML = items.map(([id, ic, l]) =>
    `<button class="${state.tab === id ? "active" : ""}" data-tab="${id}"><span>${ic}</span>${l}</button>`).join("");
}
function render() { renderSports(); renderDates(); renderFilters(); renderMain(); renderNav(); }

/* ---------- Match detail ---------- */
let openId = null, detailTab = "events";
function openMatch(id) { openId = id; detailTab = MATCHES.find(m => m.id === id).status === "upcoming" ? "info" : "events"; renderSheet(); $("sheet").classList.add("open"); $("sheetBg").classList.add("open"); }
function closeMatch() { openId = null; $("sheet").classList.remove("open"); $("sheetBg").classList.remove("open"); }
function renderSheet() {
  if (openId == null) return;
  const m = MATCHES.find(x => x.id === openId);
  const score = m.status === "upcoming" ? `<div class="hero-score" style="font-size:22px">${m.time}</div>`
    : `<div><div class="hero-score">${m.hs} – ${m.as}</div>${statusHtml(m)}</div>`;
  const tabs = [["events", m.sport === "basket" ? "Quart-temps" : "Résumé"], ["stats", "Stats"], ["info", "Infos"]];
  let panel = "";
  if (detailTab === "events") {
    panel = m.events?.length ? m.events.map(([min, side, txt]) =>
      `<div class="event"><div class="l">${side === "h" ? txt : ""}</div><div class="min">${typeof min === "number" ? min + "'" : min}</div><div class="r">${side === "a" ? txt : ""}</div></div>`).join("")
      : `<p class="empty">Pas encore d'événements.</p>`;
  } else if (detailTab === "stats") {
    panel = m.stats?.length ? m.stats.map(([label, h, a, unit = ""]) => {
      const tot = h + a || 1;
      return `<div class="stat"><div class="stat-top"><span>${h}${unit}</span><span>${label}</span><span>${a}${unit}</span></div>
        <div class="bar"><i><b style="width:${h / tot * 100}%"></b></i><i><b style="width:${a / tot * 100}%"></b></i></div></div>`;
    }).join("") : `<p class="empty">Statistiques disponibles pendant le match.</p>`;
  } else {
    const [d] = dayLabel(m.day);
    panel = `<div class="info">
      <div><span>Compétition</span><span>${m.comp} ${m.round}</span></div>
      <div><span>Date</span><span>${d}${m.time ? " · " + m.time : ""}</span></div>
      <div><span>Lieu</span><span>${m.venue || "—"}</span></div>
    </div>${m.status === "upcoming" ? `<button class="remind" data-fav="${m.id}">${favs.has(m.id) ? "✓ Rappel activé" : "🔔 Me rappeler avant le match"}</button>` : ""}`;
  }
  $("sheet").innerHTML = `
    <div class="hero">
      <button class="icon-btn close" data-close>✕</button>
      <div class="comp-name">${m.comp} ${m.round}</div>
      <div class="hero-row">
        <div class="hero-team">${crest(m.h)}${TEAMS[m.h].name}</div>
        ${score}
        <div class="hero-team">${crest(m.a)}${TEAMS[m.a].name}</div>
      </div>
    </div>
    <div class="tabs">${tabs.map(([id, l]) => `<button class="${detailTab === id ? "active" : ""}" data-dtab="${id}">${l}</button>`).join("")}</div>
    <div class="panel">${panel}</div>`;
}

/* ---------- Events ---------- */
document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-fav],[data-sport],[data-day],[data-filter],[data-tab],[data-match],[data-dtab],[data-close]");
  if (!t) { if (e.target.id === "sheetBg") closeMatch(); return; }
  const d = t.dataset;
  if (d.fav) { const id = +d.fav; favs.has(id) ? favs.delete(id) : favs.add(id); saveFavs(); render(); renderSheet(); return; }
  if (d.sport) { state.sport = d.sport; state.filter = "all"; }
  if (d.day) state.day = +d.day;
  if (d.filter) state.filter = d.filter;
  if (d.tab) state.tab = d.tab;
  if (d.match) return openMatch(+d.match);
  if (d.dtab) { detailTab = d.dtab; return renderSheet(); }
  if (d.close !== undefined) return closeMatch();
  render();
});

$("themeBtn").onclick = () => {
  const root = document.documentElement;
  const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme = dark ? "light" : "dark";
};

/* Simulate live clock: football minutes tick every 6 s */
setInterval(() => {
  MATCHES.forEach(m => { if (m.status === "live" && typeof m.min === "number" && m.min < 90) m.min++; });
  renderMain(); renderSheet();
}, 6000);

render();
</script>
</body>
</html>
